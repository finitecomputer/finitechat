[workspace]
resolver = "2"
members = [
  "crates/finitechat-transport",
  "crates/finitechat-delivery",
  "crates/finitechat-blob",
  "crates/finitechat-proto",
  "crates/finitechat-mls",
  "crates/finitechat-client",
  "crates/finitechat-core",
  "crates/finitechat-hermes",
  "crates/finitechat-http",
  "crates/finitechat-server",
  "crates/finitechat-cli",
  "crates/finitechat-rmp",
  "uniffi-bindgen",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/finitecomputer/finitechat"
rust-version = "1.88"

[workspace.dependencies]
axum = "0.8"
# APNs requires HTTP/2. Keep this exact pin until the registry used by CI
# resolves newer reqwest HTTP/2 dependencies cleanly.
reqwest = { version = "=0.12.27", default-features = false, features = ["blocking", "http2", "json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
hmac = "0.12"
bech32 = "0.11"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
futures-util = "0.3"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
hypernote-mdx = { git = "https://github.com/futurepaul/hypernote-mdx", rev = "db23b3d72e81389247716c5a59174cc4f4d55a34", version = "0.3.0" }
# Shared on-disk Nostr identity (Finite Identity Contract v1): one account key
# per user at $FINITE_HOME/identity/ (or ~/.finite/identity/), minted by
# whichever Finite tool runs first.
finite-identity = { git = "https://github.com/finitecomputer/finite-identity", rev = "fa718d071fe289db95121781a52afaa6c0fbb926" }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
uniffi = "0.31"
walkdir = "2"
openmls = { version = "0.8.1", default-features = false }
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"
openmls_memory_storage = { version = "0.5.0", features = ["extensions-draft-08"] }
secp256k1 = { version = "0.29.1", default-features = false, features = ["std"] }
finitechat-transport = { path = "crates/finitechat-transport" }
finitechat-delivery = { path = "crates/finitechat-delivery" }
