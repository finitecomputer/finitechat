[workspace]
resolver = "2"
members = [
  "crates/finitechat-darkmatter",
  "crates/finitechat-blob",
  "crates/finitechat-proto",
  "crates/finitechat-engine",
  "crates/finitechat-store",
  "crates/finitechat-sim",
  "crates/finitechat-mls",
  "crates/finitechat-client",
  "crates/finitechat-hermes",
  "crates/finitechat-http",
  "crates/finitechat-server",
  "crates/finitechat-cli",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/finitecomputer/finite-chat-darkmatter"
rust-version = "1.88"

[workspace.dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hkdf = "0.12"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
openmls = { version = "0.8.1", default-features = false }
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"
secp256k1 = { version = "0.29.1", default-features = false, features = ["std"] }
cgka-engine = { path = "../darkmatter/crates/cgka-engine" }
cgka-conformance-simulator = { path = "../darkmatter/crates/cgka-conformance-simulator" }
cgka-traits = { path = "../darkmatter/crates/traits" }
transport-http-server = { path = "../darkmatter/crates/transport-http-server" }
